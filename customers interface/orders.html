<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MarketLink: reserve fresh produce direct from local farms and collect it at a pickup hub near you.">
    <meta name="theme-color" content="#16A34A">
    <link rel="icon" href="../assets/images/brand/favicon.svg" type="image/svg+xml">
    <title>MarketLink — My orders</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="./assets/css/shell.css">
    <link rel="stylesheet" href="./assets/css/orders.css">
</head>
<body data-page="orders" data-guard="auth">

<main id="page">

    <div class="page-head reveal">
        <div>
            <span class="eyebrow">Reservations &amp; pickups</span>
            <h1>My <span class="hl">orders</span></h1>
            <p>Track every basket from reserved to collected, reorder favourites and leave reviews.</p>
        </div>
        <div class="pill-search"><i class='bx bx-search'></i><input id="ordSearch" type="search" placeholder="Search order ID or crop" aria-label="Search orders"></div>
    </div>

    <div class="ord-stats" id="ordStats"></div>
    <div class="tabs" id="ordTabs" role="tablist" style="margin-top:22px">
        <button class="tab-btn active" data-tab="active" role="tab">Active <span class="n" data-n="active">0</span></button>
        <button class="tab-btn" data-tab="collected" role="tab">Completed <span class="n" data-n="collected">0</span></button>
        <button class="tab-btn" data-tab="cancelled" role="tab">Cancelled <span class="n" data-n="cancelled">0</span></button>
        <button class="tab-btn" data-tab="all" role="tab">All <span class="n" data-n="all">0</span></button>
    </div>
    <div class="ord-list" id="ordList"></div>

</main>

    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/store.js"></script>
    <script src="./assets/js/api.js"></script>
    <script src="./assets/js/ui.js"></script>
    <script src="./assets/js/shell.js"></script>
    <script src="./assets/js/orders.js"></script>
</body>
</html>
