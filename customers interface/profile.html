<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MarketLink: reserve fresh produce direct from local farms and collect it at a pickup hub near you.">
    <meta name="theme-color" content="#16A34A">
    <link rel="icon" href="../assets/images/brand/favicon.svg" type="image/svg+xml">
    <title>MarketLink — Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="./assets/css/shell.css">
    <link rel="stylesheet" href="./assets/css/account.css">
</head>
<body data-page="profile" data-guard="auth">

<main id="page">

    <section class="pf-hero reveal" id="pfHero"></section>
    <div class="pf-grid">
        <section class="card pf-form">
            <h2>Personal details</h2>
            <p class="muted" style="margin-bottom:18px">These appear on your pickup tickets.</p>
            <form id="pfForm" novalidate>
                <div class="form-row">
                    <label class="field" data-f="name"><span>Full name</span><div class="input-wrap"><i class='bx bx-user lead'></i><input class="input" id="pName" autocomplete="name"></div><em class="err">Enter your name.</em></label>
                    <label class="field" data-f="email"><span>Email</span><div class="input-wrap"><i class='bx bx-envelope lead'></i><input class="input" id="pEmail" type="email" autocomplete="email" readonly></div><em class="err">Enter a valid email.</em></label>
                </div>
                <div class="form-row">
                    <label class="field" data-f="phone"><span>Phone</span><div class="input-wrap"><i class='bx bx-phone lead'></i><input class="input" id="pPhone" type="tel" autocomplete="tel" placeholder="+234 801 234 5678"></div><em class="err">Enter a valid phone number.</em></label>
                    <label class="field" data-f="area"><span>Neighbourhood</span><div class="input-wrap"><i class='bx bx-map lead'></i><input class="input" id="pArea" autocomplete="address-level2" placeholder="Yaba, Lagos"></div><em class="err">Tell us where you live.</em></label>
                </div>
                <div class="pf-actions"><button class="btn btn-primary" type="submit"><i class='bx bx-save'></i> Save changes</button><button class="btn btn-ghost" type="button" id="pfReset">Reset</button></div>
            </form>
        </section>
        <aside class="pf-side">
            <section class="card" id="pfHub"></section>
            <section class="card" id="pfRecent"></section>
        </aside>
    </div>
    <div class="pf-links reveal">
        <a class="pf-link" href="orders.html"><i class='bx bx-receipt'></i><b>My orders</b><span>Track and reorder</span></a>
        <a class="pf-link" href="favorites.html"><i class='bx bx-heart'></i><b>Favorites</b><span>Saved produce and farms</span></a>
        <a class="pf-link" href="settings.html"><i class='bx bx-cog'></i><b>Settings</b><span>Hub, alerts and theme</span></a>
        <button class="pf-link" data-signout><i class='bx bx-log-out'></i><b>Sign out</b><span>See you next harvest</span></button>
    </div>

</main>

    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/store.js"></script>
    <script src="./assets/js/api.js"></script>
    <script src="./assets/js/ui.js"></script>
    <script src="./assets/js/shell.js"></script>
    <script src="./assets/js/account.js"></script>
</body>
</html>
